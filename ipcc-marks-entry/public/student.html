<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IPCC Student Dashboard - View Your Marks">
    <title>IPCC Marks Entry - Student</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="brand">
            <span class="brand-dot"></span>
            IPCC Marks Entry
        </div>
        <div class="user-area">
            <span id="navUserName"></span>
            <span class="role-badge student">Student</span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="page">
        <!-- Quick Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card blue anim-fade-up">
                <div class="stat-label">Subjects</div>
                <div class="stat-value" id="statSubjects">0</div>
                <div class="stat-sub">With marks entered</div>
            </div>
            <div class="stat-card green anim-fade-up d1">
                <div class="stat-label">Avg Theory</div>
                <div class="stat-value" id="statTheoryAvg">0</div>
                <div class="stat-sub">Across all IAs</div>
            </div>
            <div class="stat-card purple anim-fade-up d2">
                <div class="stat-label">Avg Lab</div>
                <div class="stat-value" id="statLabAvg">0</div>
                <div class="stat-sub">Internal + External</div>
            </div>
        </div>

        <div class="section anim-fade-up d3">
            <div class="section-header">
                <div class="section-title">Your Marks</div>
            </div>
            <p class="hint">Marks entered for your USN across all subjects. Colors indicate performance: <span
                    style="color:var(--green-600);font-weight:600;">green</span> = good, <span
                    style="color:var(--amber-600);font-weight:600;">amber</span> = average, <span
                    style="color:var(--red-600);font-weight:600;">red</span> = needs improvement.</p>
            <div id="studentMarks">
                <div class="empty">Loading your marks...</div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/student.js"></script>
</body>

</html>
